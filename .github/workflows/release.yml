# ---------------------------------------------------------------------------
# Release pipeline — triggered on semver tags (v*)
#
# Flow:
#   tag pushed → test → goreleaser (build + sign + sbom + docker + homebrew)
#               → attest provenance → scan image → notify
#
# Required secrets:
#   HOMEBREW_TAP_GITHUB_TOKEN  — PAT with write access to gustavoesser/homebrew-tap
#
# Required variables: none (GITHUB_TOKEN is automatic)
# ---------------------------------------------------------------------------
name: Release

on:
  push:
    tags:
      - "v*"

# Permissions required for:
#   contents:write      — create GitHub Release, upload assets
#   packages:write      — push to GHCR
#   id-token:write      — OIDC token for cosign keyless signing
#   attestations:write  — GitHub artifact attestations (SLSA provenance)
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # never cancel an in-progress release

jobs:
  # -------------------------------------------------------------------------
  # Gate — run tests before releasing
  # -------------------------------------------------------------------------
  test:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go test ./...

  # -------------------------------------------------------------------------
  # Release — GoReleaser: build, sign, SBOM, Docker, Homebrew
  # -------------------------------------------------------------------------
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    needs: test
    outputs:
      digest-amd64: ${{ steps.goreleaser.outputs.digest }}  # used by attest job
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for changelog generation

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # cosign — keyless signing via GitHub OIDC
      - uses: sigstore/cosign-installer@v3

      # syft — SBOM generation
      - uses: anchore/sbom-action/download-syft@v0

      # Docker Buildx — multi-arch builds
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Authenticate to GHCR
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Run GoReleaser
      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          COSIGN_EXPERIMENTAL: "1"

      # Upload dist/ for the attestation job
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # -------------------------------------------------------------------------
  # Provenance — SLSA3 attestations via GitHub native attestations
  # -------------------------------------------------------------------------
  attest:
    name: Provenance attestation
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Attest all release archives and checksums
      - name: Attest archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      # Attest SBOM files
      - name: Attest SBOMs
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.sbom.spdx.json

  # -------------------------------------------------------------------------
  # Scan — vulnerability scan of the published Docker image
  # -------------------------------------------------------------------------
  scan-image:
    name: Scan Docker image
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Trivy — scan published image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ghcr.io/gustavoesser/a3k:${{ github.ref_name }}"
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"  # report only, don't fail the release

      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container
