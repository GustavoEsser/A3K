# ---------------------------------------------------------------------------
# Release pipeline — triggered on semver tags (v*)
#
# Flow:
#   tag pushed → test → goreleaser (build + sign + sbom + homebrew)
#               → attest provenance
#
# Required secrets:
#   HOMEBREW_TAP_GITHUB_TOKEN  — PAT with write access to gustavoesser/homebrew-tap
#
# Required variables: none (GITHUB_TOKEN is automatic)
# ---------------------------------------------------------------------------
name: Release

on:
  push:
    tags:
      - "v*"

# Permissions required for:
#   contents:write      — create GitHub Release, upload assets
#   id-token:write      — OIDC token for cosign keyless signing
#   attestations:write  — GitHub artifact attestations (SLSA provenance)
permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # never cancel an in-progress release

jobs:
  # -------------------------------------------------------------------------
  # Gate — run tests before releasing
  # -------------------------------------------------------------------------
  test:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go test ./...

  # -------------------------------------------------------------------------
  # Release — GoReleaser: build, sign, SBOM, Homebrew
  # -------------------------------------------------------------------------
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for changelog generation

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # cosign — keyless signing via GitHub OIDC
      - uses: sigstore/cosign-installer@v3

      # syft — SBOM generation
      - uses: anchore/sbom-action/download-syft@v0

      # Run GoReleaser
      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          COSIGN_EXPERIMENTAL: "1"

      # Upload dist/ for the attestation job
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # -------------------------------------------------------------------------
  # Provenance — SLSA3 attestations via GitHub native attestations
  # -------------------------------------------------------------------------
  attest:
    name: Provenance attestation
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Attest all release archives and checksums
      - name: Attest archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      # Attest SBOM files
      - name: Attest SBOMs
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.sbom.spdx.json
