# ---------------------------------------------------------------------------
# Security scanning — runs on schedule + every push to main
#
# Covers:
#   - govulncheck       Go stdlib + module vulnerability database
#   - dependency-review Block PRs introducing vulnerable dependencies
# ---------------------------------------------------------------------------
name: Security

on:
  schedule:
    - cron: "0 8 * * 1"  # every Monday at 08:00 UTC
  push:
    branches: [main]
  workflow_dispatch:     # allow manual trigger

permissions:
  contents: read
  security-events: write  # upload SARIF to GitHub Security tab

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # govulncheck — Go vulnerability database
  # -------------------------------------------------------------------------
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  # -------------------------------------------------------------------------
  # Dependency review — block PRs introducing vulnerable dependencies
  # -------------------------------------------------------------------------
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
