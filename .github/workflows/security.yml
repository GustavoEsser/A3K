# ---------------------------------------------------------------------------
# Security scanning — runs on schedule + every push to main
#
# Covers:
#   - govulncheck    Go stdlib + module vulnerability database
#   - Trivy          Docker image scan (CRITICAL/HIGH CVEs)
#   - Grype          SBOM-based vulnerability scan
#   - nancy          Go dependency audit (via Sonatype OSS Index)
# ---------------------------------------------------------------------------
name: Security

on:
  schedule:
    - cron: "0 8 * * 1"  # every Monday at 08:00 UTC
  push:
    branches: [main]
  workflow_dispatch:     # allow manual trigger

permissions:
  contents: read
  security-events: write  # upload SARIF to GitHub Security tab

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # govulncheck — Go vulnerability database
  # -------------------------------------------------------------------------
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  # -------------------------------------------------------------------------
  # Trivy — scan source code (filesystem) for CVEs and misconfigurations
  # -------------------------------------------------------------------------
  trivy-fs:
    name: Trivy (filesystem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # -------------------------------------------------------------------------
  # Trivy — scan published Docker image (only on schedule or main push)
  # -------------------------------------------------------------------------
  trivy-image:
    name: Trivy (Docker image)
    runs-on: ubuntu-latest
    steps:
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ghcr.io/gustavoesser/a3k:latest"
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH

      - name: Upload results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # -------------------------------------------------------------------------
  # Grype — SBOM-based vulnerability scan against released artifact
  # -------------------------------------------------------------------------
  grype:
    name: Grype (image)
    runs-on: ubuntu-latest
    steps:
      - name: Grype scan
        uses: anchore/scan-action@v6
        id: scan
        with:
          image: "ghcr.io/gustavoesser/a3k:latest"
          severity-cutoff: high
          fail-build: false  # report without failing the pipeline

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype

  # -------------------------------------------------------------------------
  # Dependency review — block PRs introducing vulnerable dependencies
  # -------------------------------------------------------------------------
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
