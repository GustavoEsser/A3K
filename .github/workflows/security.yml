# ---------------------------------------------------------------------------
# Security — dependency review on every PR targeting main
# Blocks merges that introduce deps with HIGH/CRITICAL CVEs or banned licenses
# ---------------------------------------------------------------------------
name: Security

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write  # permite comentar o resultado no PR

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
