# ---------------------------------------------------------------------------
# Pipeline A3K — CI + Release automático em um único workflow
#
# Gatilhos:
#   pull_request → main  : build · test · goreleaser-check · dependency-review
#   push → main          : build · test · goreleaser-check → auto-tag → release
#
# Versionamento por Conventional Commits:
#   feat:              → minor  (v1.0.0 → v1.1.0)
#   fix: / refactor:   → patch  (v1.0.0 → v1.0.1)
#   feat!: / BREAKING  → major  (v1.0.0 → v2.0.0)
#   chore: / docs: / ci: / build: → sem tag, sem release
#
# Secrets necessários:
#   HOMEBREW_TAP_GITHUB_TOKEN  PAT com write no GustavoEsser/homebrew-tap
# ---------------------------------------------------------------------------
name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # -------------------------------------------------------------------------
  # Build — compila nas 3 plataformas alvo
  # -------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Build (linux/amd64)
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null .

      - name: Build (linux/arm64)
        run: CGO_ENABLED=0 GOARCH=arm64 go build -trimpath -o /dev/null .

      - name: Build (darwin/arm64)
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o /dev/null .

  # -------------------------------------------------------------------------
  # Test
  # -------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # -------------------------------------------------------------------------
  # GoReleaser check — valida .goreleaser.yaml sem compilar
  # -------------------------------------------------------------------------
  goreleaser-check:
    name: GoReleaser config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

  # -------------------------------------------------------------------------
  # Dependency review — bloqueia deps com CVE high+ ou licenças proibidas
  # Só roda em PRs
  # -------------------------------------------------------------------------
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

  # -------------------------------------------------------------------------
  # Release — auto-versiona e publica quando build + test passam na main
  # Só roda em push direto na main (não em PRs)
  # -------------------------------------------------------------------------
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, test, goreleaser-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # histórico completo para changelog e cálculo de versão

      # ----- 1. Calcula e cria a próxima tag semver -----
      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false      # chore/docs/ci não geram release
          release_branches: main
          tag_prefix: v

      # Os passos seguintes só executam se uma nova tag foi criada
      # ----- 2. Setup de ferramentas -----
      - uses: actions/setup-go@v5
        if: steps.tag.outputs.new_tag != ''
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cosign
        if: steps.tag.outputs.new_tag != ''
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        if: steps.tag.outputs.new_tag != ''
        uses: anchore/sbom-action/download-syft@v0

      # ----- 3. GoReleaser — build + sign + SBOM + Homebrew + GitHub Release -----
      - name: Run GoReleaser
        if: steps.tag.outputs.new_tag != ''
        id: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          COSIGN_EXPERIMENTAL: "1"
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.new_tag }}

      # ----- 4. Upload dist/ para o job de atestação -----
      - name: Upload dist artifacts
        if: steps.tag.outputs.new_tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

      # ----- 5. SLSA provenance nos assets da release -----
      - name: Attest archives
        if: steps.tag.outputs.new_tag != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: Attest SBOMs
        if: steps.tag.outputs.new_tag != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.sbom.spdx.json
