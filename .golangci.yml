# golangci-lint v2 configuration for A3K
# Docs: https://golangci-lint.run/docs/product/migration-guide
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    # Correctness
    - errcheck        # unchecked errors
    - govet           # go vet
    - staticcheck     # staticcheck SA rules
    - ineffassign     # assignments with no effect
    - unused          # unused code

    # Security
    - gosec           # security issues (G101..G602)

    # Style / quality
    - revive          # opinionated golint replacement
    - misspell        # spelling mistakes in comments/strings
    - gocritic        # various checks

    # Error handling
    - wrapcheck       # errors from external packages should be wrapped
    - errorlint       # common error handling mistakes

    # Context
    - noctx           # http requests without context

    # Maintainability
    - cyclop          # cyclomatic complexity
    - gocognit        # cognitive complexity
    - maintidx        # maintainability index

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false

    gosec:
      excludes:
        - G304  # file inclusion via variable — intentional for kubeconfig path
        - G204  # subprocess with variable args — intentional for gum CLI tool

    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck

    cyclop:
      max-complexity: 60  # K8s data processing functions have inherent complexity

    gocognit:
      min-complexity: 130

    wrapcheck:
      ignore-package-globs:
        - "github.com/flysecurity/a3k/*"
        - "github.com/spf13/cobra"

formatters:
  enable:
    - gofmt
    - goimports

issues:
  exclude-rules:
    # Tests have different standards
    - path: _test\.go
      linters: [gosec, errcheck, wrapcheck]

    # Main entrypoint — os.Exit is fine
    - path: main\.go
      linters: [revive]

    # internal/k8s — high complexity is inherent to Kubernetes domain processing
    - path: internal/k8s/
      linters: [maintidx]

    # internal/output — writes to os.Stdout, fmt.Fprint* errors are not actionable
    - path: internal/output/
      linters: [errcheck]

    # internal/ packages are not public API — exported doc comments not required
    - path: internal/
      linters: [revive]
      text: exported

    # Portuguese words in Kubernetes report strings — not English misspellings
    - linters: [misspell]
      text: '`Problemas` is a misspelling'
    - linters: [misspell]
      text: '`Eles` is a misspelling'
    - linters: [misspell]
      text: '`contextos` is a misspelling'
    - linters: [misspell]
      text: '`Autor` is a misspelling'
    - linters: [misspell]
      text: '`operacional` is a misspelling'

  max-issues-per-linter: 50
  max-same-issues: 5
