# golangci-lint v2 configuration for A3K
# Docs: https://golangci-lint.run/docs/product/migration-guide
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    # Correctness
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused

    # Security
    - gosec

    # Style / quality
    - revive
    - misspell
    - gocritic

    # Error handling
    - wrapcheck
    - errorlint

    # Context
    - noctx

    # Maintainability
    - cyclop
    - gocognit
    - maintidx

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false

    gosec:
      excludes:
        - G304  # kubeconfig path variable — intentional
        - G204  # gum subprocess with variable args — intentional

    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck

    cyclop:
      max-complexity: 60

    gocognit:
      min-complexity: 130

    wrapcheck:
      ignore-package-globs:
        - "github.com/flysecurity/a3k/*"
        - "github.com/spf13/cobra"

  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, wrapcheck]
      - path: main\.go
        linters: [revive]

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
